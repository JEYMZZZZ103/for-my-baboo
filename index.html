<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Baboo ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Sparkles -->
    <div id="sparkles"></div>

    <!-- Rose Petals -->
    <div id="petals"></div>

    <!-- Background Stars -->
    <div id="stars"></div>

    <!-- Intro Screen -->

    <section class="intro" id="intro">

        <h1>For My Baboo ❤️</h1>

        <p>
            Every heartbeat reminds me of you...
        </p>

        <button id="startBtn">
            SCROLL DOWN 💌
        </button>

    </section>

    <!-- Main Website -->

    <section class="hidden" id="mainContent">

        <!-- Envelope -->

        <div class="envelope-container">

            <div class="envelope" id="envelope">

                <div class="front"></div>

                <div class="letter">

                    <div class="paper">

                        <h2>Click Me ❤️</h2>

                        <div id="typedText"></div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Gallery -->

        <section class="gallery">

            <h2>Our Memories 📸</h2>

            <div class="photos">

                <img src="images/photo1.png">

                <img src="images/photo2.png">

                <img src="images/photo3.png">

                <img src="images/photo4.png">

                <img src="images/photo5.png">

                <img src="images/photo6.png">

            </div>

        </section>

        <!-- Reasons -->

        <section class="reasons">

            <h2>
                Reasons Why I Love You ❤️
            </h2>

            <div class="cards">

                <div class="card">
                    Your Smile 😊
                </div>

                <div class="card">
                    Your Kindness 💖
                </div>

                <div class="card">
                    Your Heart ❤️
                </div>

                <div class="card">
                    Your Laugh 😂
                </div>

                <div class="card">
                    Everything About You 🌸
                </div>

                <div class="card">
                    You Make Me Happy 🥰
                </div>

            </div>

        </section>

        <!-- Surprise -->

        <section class="surprise">

            <button id="surpriseBtn">

                Click Me ❤️
            </button>
            
            <h1 id="finalMessage">
                I LOVE U FOREVER ❤️
            </h1>
        </section>
    </section>
    <script src="script.js"></script>
</body>
</html>
